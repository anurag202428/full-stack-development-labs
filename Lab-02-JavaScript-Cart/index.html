<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anurag Store — JavaScript Cart</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body><header><a href="index.html">Anurag Store</a><nav><a href="#products">Products</a><a href="#cart">Cart <span id="cart-count">0</span></a></nav></header><main><h1>Dynamic Product Store</h1><p id="message" role="status"></p><section id="products"><h2>Products</h2><div id="product-list" class="grid"></div></section><section id="cart"><h2>Your Cart</h2><p id="empty-cart">Your cart is empty.</p><div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th><th></th></tr></thead><tbody id="cart-items"></tbody><tfoot><tr><th colspan="3">Grand total</th><th id="cart-total">₹0</th><th></th></tr></tfoot></table></div></section><section><h2>Checkout validation demo</h2><form id="checkout-form"><label>Name<input name="name" required></label><label>Address<input name="address" required></label><label>Pincode<input name="pincode" inputmode="numeric" required></label><label>Phone<input name="phone" inputmode="numeric" required></label><button>Validate demo order</button></form></section></main></body></html>
