<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selected Students</title><style>body{font:16px/1.6 Arial;background:#f4f6f8;color:#1f2937;max-width:850px;margin:40px auto;padding:0 20px}.panel{background:white;padding:24px;border-radius:14px;margin:20px 0;box-shadow:0 4px 18px #0001}li{padding:5px}</style></head><body><h1>Selected Students</h1><section class="panel"><h2>Unordered List</h2><ul>{% for student in students %}<li>{{ student.name }} — {{ student.course }} (Year {{ student.year }})</li>{% endfor %}</ul></section><section class="panel"><h2>Ordered List</h2><ol>{% for student in students %}<li>{{ student.name }} — {{ student.course }}</li>{% endfor %}</ol></section></body></html>
